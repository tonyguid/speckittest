name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Backend Build and Test
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/backend

      - name: Build
        run: dotnet build src/backend --configuration Release --no-restore

      - name: Run unit and integration tests
        run: dotnet test src/backend --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: backend-test-results
          path: '**/test-results.trx'

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: backend-coverage
          path: '**/coverage.cobertura.xml'

      - name: Publish coverage to CodeCov
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: '**/coverage.cobertura.xml'
          flags: backend
          name: backend-coverage

  # Frontend Build and Test
  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: 'src/frontend/package-lock.json'

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Build
        working-directory: src/frontend
        run: npm run build

      - name: Run unit tests
        working-directory: src/frontend
        run: npm run test

      - name: Generate coverage report
        working-directory: src/frontend
        run: npm run test:coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: frontend-coverage
          path: 'src/frontend/coverage'

      - name: Publish coverage to CodeCov
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: 'src/frontend/coverage/coverage-final.json'
          flags: frontend
          name: frontend-coverage

  # E2E Tests
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: 'src/frontend/package-lock.json'

      - name: Install Playwright browsers
        working-directory: src/frontend
        run: npx playwright install --with-deps

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Setup .NET for backend
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Start backend API
        working-directory: src/backend
        run: |
          dotnet restore
          dotnet build --configuration Release
          dotnet run --project BlobCopy.API --configuration Release &
          sleep 10  # Wait for API to start

      - name: Start frontend dev server
        working-directory: src/frontend
        run: npm start &
        env:
          VITE_API_URL: 'http://localhost:5000'

      - name: Wait for services to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:5000/health && curl -s http://localhost:3000; then
              echo "Services are ready"
              exit 0
            fi
            sleep 1
          done
          echo "Services failed to start"
          exit 1

      - name: Run E2E tests
        working-directory: src/frontend
        run: npm run test:e2e

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: e2e-test-results
          path: 'src/frontend/test-results'

      - name: Upload E2E test videos
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: e2e-test-videos
          path: 'src/frontend/test-results/videos'

  # Code Quality
  quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Lint TypeScript
        working-directory: src/frontend
        run: npm run lint

      - name: Check code formatting
        working-directory: src/frontend
        run: npm run format:check

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Analyze .NET code
        working-directory: src/backend
        run: |
          dotnet restore
          dotnet build --configuration Release

  # Build Docker Image (Optional)
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: src/backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/blobcopy-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: src/frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/blobcopy-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Summary
  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [ backend, frontend, e2e, quality ]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "Backend tests: ${{ needs.backend.result }}"
          echo "Frontend tests: ${{ needs.frontend.result }}"
          echo "E2E tests: ${{ needs.e2e.result }}"
          echo "Code quality: ${{ needs.quality.result }}"

          if [[ "${{ needs.backend.result }}" == "failure" || "${{ needs.frontend.result }}" == "failure" || "${{ needs.e2e.result }}" == "failure" || "${{ needs.quality.result }}" == "failure" ]]; then
            echo "❌ Some tests failed"
            exit 1
          else
            echo "✅ All tests passed"
            exit 0
          fi
